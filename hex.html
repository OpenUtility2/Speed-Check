<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker & Image Eyedropper — OpenUtility</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.65);
      --primary-blue: #00a8ff;
      --primary-green: #7bed9f;
      --accent-glow: rgba(0, 168, 255, 0.25);
      --text-main: #ffffff;
      --text-muted: #8a99ad;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 168, 255, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(123, 237, 159, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 1.5rem;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      background: rgba(0, 168, 255, 0.1);
      border: 1px solid rgba(0, 168, 255, 0.2);
      color: var(--primary-blue);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    main {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin: auto 0;
    }

    @media (max-width: 850px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.8rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Color Preview Block */
    .color-display-container {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .color-preview {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      background-color: #00a8ff;
      border: 2px solid var(--border-color);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: background-color 0.1s ease;
      flex-shrink: 0;
    }

    .color-inputs {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
    }

    .input-group {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.4rem 0.8rem;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      width: 45px;
    }

    .input-group input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
      outline: none;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 5px;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      color: var(--primary-blue);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Standard Palette Controls */
    .native-picker-row {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .native-picker-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.6rem 1rem;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      justify-content: center;
    }

    .native-picker-btn input[type="color"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      left: 0;
      top: 0;
    }

    .action-btn {
      background: linear-gradient(135deg, var(--primary-blue), #0072ff);
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 0.7rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 6px 15px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 168, 255, 0.4);
    }

    /* Upload & Image Dropzone */
    .dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .dropzone:hover {
      border-color: var(--primary-blue);
      background: rgba(0, 168, 255, 0.03);
    }

    .dropzone p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-height: 320px;
      overflow: hidden;
      border-radius: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 1px solid var(--border-color);
      cursor: crosshair;
    }

    canvas {
      max-width: 100%;
      max-height: 320px;
      display: block;
      object-fit: contain;
    }

    /* Magnifier Loupe */
    .loupe {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%);
      background-repeat: no-repeat;
      z-index: 10;
    }

    /* Shades History */
    .history-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .swatches {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.15s ease;
    }

    .swatch:hover {
      transform: scale(1.15);
    }

    footer {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 2rem;
    }

    .brand-container {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-main);
      font-weight: 600;
    }

    .openutility-logo {
      width: 22px;
      height: 22px;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      background: var(--primary-blue);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>COLOR</span><span style="color: #fff; font-weight: 300;">PICKER</span>
    </div>
    <div class="badge">OpenUtility Tools</div>
  </header>

  <main>
    <!-- Left Card: Color Inspector -->
    <div class="card">
      <div class="card-title">🎨 Color Inspector</div>

      <div class="color-display-container">
        <div class="color-preview" id="previewBox"></div>
        <div class="color-inputs">
          <div class="input-group">
            <label>HEX</label>
            <input type="text" id="hexInput" value="#00A8FF">
            <button class="copy-btn" onclick="copyVal('hexInput')">Copy</button>
          </div>
          <div class="input-group">
            <label>RGB</label>
            <input type="text" id="rgbInput" readonly value="rgb(0, 168, 255)">
            <button class="copy-btn" onclick="copyVal('rgbInput')">Copy</button>
          </div>
          <div class="input-group">
            <label>HSL</label>
            <input type="text" id="hslInput" readonly value="hsl(201, 100%, 50%)">
            <button class="copy-btn" onclick="copyVal('hslInput')">Copy</button>
          </div>
        </div>
      </div>

      <div class="native-picker-row">
        <button class="native-picker-btn">
          Select Custom Color
          <input type="color" id="nativeColorPicker" value="#00a8ff">
        </button>
        <button class="action-btn" id="screenEyedropperBtn" style="display:none;">
          Screen Dropper
        </button>
      </div>

      <div>
        <div class="history-title" style="margin-bottom:0.5rem;">Recent Swatches</div>
        <div class="swatches" id="swatchContainer"></div>
      </div>
    </div>

    <!-- Right Card: Image Eyedropper -->
    <div class="card">
      <div class="card-title">🖼️ Image Eyedropper</div>

      <div class="dropzone" id="dropzone" onclick="document.getElementById('imageInput').click()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p><strong>Click to upload</strong> or drag & drop an image</p>
        <span style="font-size:0.75rem; color:var(--text-muted);">Supports PNG, JPG, WebP, SVG</span>
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <div class="loupe" id="loupe"></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <footer>
    <span>Powered by</span>
    <div class="brand-container">
      <svg class="openutility-logo" viewBox="0 0 400 400" fill="none">
        <path d="M 86.8 200 C 86.8 137.4 137.4 86.8 200 86.8 C 262.5 86.8 313.1 137.4 313.1 200 C 313.1 262.5 262.5 313.1 200 313.1 L 200 352.8 C 284.4 352.8 352.8 284.4 352.8 200 C 352.8 115.5 284.4 47.1 200 47.1 C 115.5 47.1 47.1 115.5 47.1 200 L 86.8 200 Z" fill="#00a8ff"/>
        <path d="M 173.3 173.3 C 158.6 188 158.6 211.9 173.3 226.6 C 188 241.3 211.9 241.3 226.6 226.6 L 277.6 226.6 C 262.9 270.8 221 302 171.9 302 C 112.5 302 64.3 253.8 64.3 194.4 C 64.3 145.3 95.5 103.4 139.7 88.7 L 173.3 173.3 Z" fill="#7bed9f"/>
      </svg>
      <span>OpenUtility</span>
    </div>
  </footer>

  <script>
    // DOM Elements
    const previewBox = document.getElementById('previewBox');
    const hexInput = document.getElementById('hexInput');
    const rgbInput = document.getElementById('rgbInput');
    const hslInput = document.getElementById('hslInput');
    const nativeColorPicker = document.getElementById('nativeColorPicker');
    const screenEyedropperBtn = document.getElementById('screenEyedropperBtn');
    const swatchContainer = document.getElementById('swatchContainer');

    const dropzone = document.getElementById('dropzone');
    const imageInput = document.getElementById('imageInput');
    const canvasContainer = document.getElementById('canvasContainer');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const loupe = document.getElementById('loupe');
    const toast = document.getElementById('toast');

    let historySwatches = ['#00A8FF', '#7BED9F', '#FF4757', '#FFA502', '#2ED573'];

    // Show Native Eyedropper if browser supports it
    if ('EyeDropper' in window) {
      screenEyedropperBtn.style.display = 'inline-flex';
      screenEyedropperBtn.addEventListener('click', async () => {
        const eyeDropper = new EyeDropper();
        try {
          const result = await eyeDropper.open();
          updateColor(result.sRGBHex);
        } catch (e) {
          // User canceled selection
        }
      });
    }

    // Color conversion helpers
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };
    }

    function updateColor(hex) {
      if (!hex.startsWith('#')) hex = '#' + hex;
      if (!/^#[0-9A-F]{6}$/i.test(hex)) return;

      const { r, g, b } = hexToRgb(hex);
      const { h, s, l } = rgbToHsl(r, g, b);

      previewBox.style.backgroundColor = hex;
      hexInput.value = hex.toUpperCase();
      rgbInput.value = `rgb(${r}, ${g}, ${b})`;
      hslInput.value = `hsl(${h}, ${s}%, ${l}%)`;
      nativeColorPicker.value = hex;

      addSwatch(hex.toUpperCase());
    }

    function addSwatch(hex) {
      if (!historySwatches.includes(hex)) {
        historySwatches.unshift(hex);
        if (historySwatches.length > 10) historySwatches.pop();
        renderSwatches();
      }
    }

    function renderSwatches() {
      swatchContainer.innerHTML = '';
      historySwatches.forEach(hex => {
        const sw = document.createElement('div');
        sw.className = 'swatch';
        sw.style.backgroundColor = hex;
        sw.onclick = () => updateColor(hex);
        swatchContainer.appendChild(sw);
      });
    }

    // Input listeners
    hexInput.addEventListener('input', (e) => updateColor(e.target.value));
    nativeColorPicker.addEventListener('input', (e) => updateColor(e.target.value));

    // Image Upload Handling
    function handleImage(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          canvasContainer.style.display = 'flex';
          dropzone.style.display = 'none';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    imageInput.addEventListener('change', (e) => handleImage(e.target.files[0]));

    // Drag and Drop
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) handleImage(e.dataTransfer.files[0]);
    });

    // Eyedropper on Canvas
    function pickCanvasColor(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      const pixel = ctx.getImageData(x, y, 1, 1).data;
      const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
      
      updateColor(hex);
    }

    canvas.addEventListener('click', pickCanvasColor);

    // Magnifying Loupe
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      loupe.style.display = 'block';
      loupe.style.left = `${x}px`;
      loupe.style.top = `${y}px`;

      const zoom = 2;
      loupe.style.backgroundImage = `url(${canvas.toDataURL()})`;
      loupe.style.backgroundSize = `${rect.width * zoom}px ${rect.height * zoom}px`;
      loupe.style.backgroundPosition = `-${x * zoom - 35}px -${y * zoom - 35}px`;
    });

    canvas.addEventListener('mouseleave', () => { loupe.style.display = 'none'; });

    // Toast Notification & Copy helper
    function copyVal(id) {
      const input = document.getElementById(id);
      navigator.clipboard.writeText(input.value);
      showToast();
    }

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Initialize
    renderSwatches();
  </script>
</body>
  </html>
