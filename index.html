<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Check</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: #00e676;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: auto 0;
    }

    .speed-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }

    .speed-value {
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
    }

    .speed-unit {
      font-size: 2rem;
      font-weight: 400;
      margin-left: 0.5rem;
      color: #aaa;
    }

    .status {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .restart-btn {
      margin-top: 2rem;
      background: transparent;
      border: 2px solid #00e676;
      color: #00e676;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      background: #00e676;
      color: #111;
    }

    .metrics {
      display: flex;
      gap: 3rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #333;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .metrics.show {
      opacity: 1;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .metric-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0.3rem;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 600;
    }

    footer {
      font-size: 0.85rem;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">FAST<span style="color:#fff;">SPEED</span></div>
  </header>

  <main>
    <div class="speed-container">
      <span class="speed-value" id="speed">0</span>
      <span class="speed-unit" id="unit">Mbps</span>
    </div>

    <div class="status" id="status">Testing speed...</div>

    <button class="restart-btn" id="restartBtn" style="display: none;" onclick="startTest()">&#215;</button>

    <div class="metrics" id="metrics">
      <div class="metric-item">
        <span class="metric-label">Latency</span>
        <span class="metric-value" id="latency">- ms</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Loaded Latency</span>
        <span class="metric-value" id="loadedLatency">- ms</span>
      </div>
    </div>
  </main>

  <footer>
    Inspired by Fast.com • Lightweight Speed Test
  </footer>

  <script>
    // Test payload configuration (Uses public reliable fast CDN files)
    const TEST_FILE_URL = 'https://speed.cloudflare.com/__down?bytes=25000000'; // 25 MB payload
    const PING_URL = 'https://speed.cloudflare.com/__down?bytes=0';

    const speedEl = document.getElementById('speed');
    const unitEl = document.getElementById('unit');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');
    const metricsEl = document.getElementById('metrics');
    const latencyEl = document.getElementById('latency');
    const loadedLatencyEl = document.getElementById('loadedLatency');

    async function measureLatency() {
      const start = performance.now();
      await fetch(PING_URL + '&r=' + Math.random(), { cache: 'no-store' });
      const end = performance.now();
      return Math.round(end - start);
    }

    async function startTest() {
      // Reset UI
      speedEl.innerText = '0';
      statusEl.innerText = 'Testing latency...';
      restartBtn.style.display = 'none';
      metricsEl.classList.remove('show');

      try {
        // 1. Measure Initial Unloaded Latency
        const pingTime = await measureLatency();
        latencyEl.innerText = `${pingTime} ms`;

        // 2. Start Download Test
        statusEl.innerText = 'Testing download speed...';
        
        const startTime = performance.now();
        let loadedBytes = 0;

        // Fetch file with streaming response to calculate speed dynamically
        const response = await fetch(TEST_FILE_URL + '&r=' + Math.random(), { cache: 'no-store' });
        const reader = response.body.getReader();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          loadedBytes += value.byteLength;
          const currentTime = performance.now();
          const durationSeconds = (currentTime - startTime) / 1000;

          if (durationSeconds > 0) {
            // Calculate Megabits per second (Mbps)
            const bitsLoaded = loadedBytes * 8;
            const speedMbps = (bitsLoaded / durationSeconds / 1000000).toFixed(1);
            
            speedEl.innerText = speedMbps;
          }
        }

        // 3. Measure Loaded Latency (latency while downloading)
        const loadedPingTime = await measureLatency();
        loadedLatencyEl.innerText = `${loadedPingTime} ms`;

        // Finish Test
        statusEl.innerText = 'Test Complete';
        metricsEl.classList.add('show');
        restartBtn.innerHTML = '&#215;'; // Reset icon
        restartBtn.style.display = 'flex';

      } catch (error) {
        statusEl.innerText = 'Error measuring speed. Check network or CORS permissions.';
        console.error(error);
        restartBtn.style.display = 'flex';
      }
    }

    // Run test on load automatically like Fast.com
    window.onload = startTest;
  </script>
</body>
  </html>
